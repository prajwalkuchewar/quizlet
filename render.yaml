version: '1'
services:
  - type: web
    name: quizlet-backend
    runtime: docker
    repo: https://github.com/prajwalkuchewar/quizlet
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_CHAT_MODEL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
    region: oregon
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    rootDir: quizlet-backend
