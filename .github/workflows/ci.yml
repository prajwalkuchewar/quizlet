name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizlet-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quizlet-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q tests

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quizlet-backend:ci quizlet-backend

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizlet-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: quizlet-client/package-lock.json
      - run: npm ci
      - run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-docker, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: quizlet-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quizlet-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quizlet-backend:latest
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: quizlet-client
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'http://localhost:8000' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quizlet-client:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quizlet-client:latest
