name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizlet-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quizlet-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q tests

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quizlet-backend:ci quizlet-backend

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizlet-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: quizlet-client/package-lock.json
      - run: npm ci
      - run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, backend-docker, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: quizlet-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quizlet-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quizlet-backend:latest
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: quizlet-client
          push: true
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/quizlet-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quizlet-client:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GHCR_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copy compose file
        run: scp docker-compose.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/docker-compose.yml"
      - name: Pull and restart on VPS
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_DIR' && \
            export GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"
