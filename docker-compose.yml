name: quizlet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizlet
      POSTGRES_USER: quizlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizlet-demo-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizlet -d quizlet"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_NAMESPACE:-prajwal018}/quizlet-backend:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-demo-only-jwt-secret-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql+psycopg://quizlet:${POSTGRES_PASSWORD:-quizlet-demo-password}@db:5432/quizlet
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_NAMESPACE:-prajwal018}/quizlet-client:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
